version: "3.9"

services:
    laravel.test:
        build:
            # trocado de 8.2 -> 8.3
            context: ./vendor/laravel/sail/runtimes/8.3
            dockerfile: Dockerfile
            args:
                # defaults para evitar WARN e erro no groupadd
                WWWUSER: "${WWWUSER:-1000}"
                WWWGROUP: "${WWWGROUP:-1000}"
        # imagem renomeada para refletir 8.3
        image: sail-8.3/app
        container_name: quickflashcards-app
        extra_hosts:
            - "host.docker.internal:host-gateway"
        ports:
            - "${APP_PORT:-80}:80"
            - "${VITE_PORT:-5173}:${VITE_PORT:-5173}"
        environment:
            # mantém variáveis do Sail
            LARAVEL_SAIL: 1
            XDEBUG_MODE: "${SAIL_XDEBUG_MODE:-off}"
            XDEBUG_CONFIG: "${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}"
            # também define defaults pra não gerar WARNs
            WWWUSER: "${WWWUSER:-1000}"
            WWWGROUP: "${WWWGROUP:-1000}"
            # opcional: força TCP no DB (sem socket)
            DB_CONNECTION: mysql
            DB_HOST: mysql
            DB_PORT: 3306
            DB_SOCKET: ""
        volumes:
            - .:/var/www/html
        networks:
            - sail
        depends_on:
            mysql:
                condition: service_healthy

    mysql:
        # use a imagem oficial (mais previsível); se preferir, pode manter mysql/mysql-server:8.0
        image: mysql:8.0
        container_name: quickflashcards-mysql
        ports:
            - "${FORWARD_DB_PORT:-3306}:3306"
        environment:
            MYSQL_ROOT_PASSWORD: "${DB_PASSWORD}"
            MYSQL_DATABASE: "${DB_DATABASE}"
            MYSQL_USER: "${DB_USERNAME}"
            MYSQL_PASSWORD: "${DB_PASSWORD}"
            MYSQL_ROOT_HOST: "%"
        volumes:
            - sail-mysql:/var/lib/mysql
            - ./vendor/laravel/sail/database/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh
        networks:
            - sail
        healthcheck:
            # importante: escape do $ para variável de container, não da tua shell
            test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$${MYSQL_ROOT_PASSWORD}"]
            interval: 10s
            timeout: 5s
            retries: 5

networks:
    sail:
        driver: bridge

volumes:
    sail-mysql:
        driver: local
